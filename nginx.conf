server {
    # 容器内使用 8080 非特权端口，Compose 再把宿主机 80 映射进来。
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AI 媒体、导出视频和接口请求可能较大，给请求体留足空间。
    client_max_body_size 200m;
    # 上游容器失联时快速返回，让前端自己的 12 秒请求超时能明确提示用户。
    # 长任务仍使用各 location 的 read/send timeout，不改变异步任务接口行为。
    proxy_connect_timeout 5s;

    # 前端请求 /api/... 统一进入 FastAPI。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 生成图片、音频、视频和导出 MP4 由 FastAPI 媒体服务读取 .codex-runtime 后返回。
    location /generated/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # COS/本地对象存储参考图统一由 FastAPI 媒体服务读取并返回，保持单一 /storage/ 代理。
    # 缺少该代理时，/storage/... 会被 SPA fallback 返回 index.html，
    # Agnes 会把 HTML 当图片解析并报 cannot identify image file。
    location /storage/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # mock 模式下会生成 /mock/image 和 /mock/audio 地址，也统一交给 FastAPI 处理。
    location /mock/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /mock-assets/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vue 单页应用刷新任意路由时，都回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
