name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node-tests:
    name: Node 单测（node:test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: npm test
        run: npm test

  api-tests:
    name: api-service pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-service/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: pytest
        run: pytest -q
